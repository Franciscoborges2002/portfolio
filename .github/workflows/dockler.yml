name: Build & Scan Docker Image with dockle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t myapp:${{ github.sha }} .

      - name: Install Dockle
        run: |
          VERSION=$(curl --silent "https://api.github.com/repos/goodwithtech/dockle/releases/latest" | \
            grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
          curl -L -o dockle.deb https://github.com/goodwithtech/dockle/releases/download/v${VERSION}/dockle_${VERSION}_Linux-64bit.deb
          sudo dpkg -i dockle.deb && rm dockle.deb

      - name: Run Dockle
        run: |
          dockle \
            --exit-code 1 \
            --exit-level warn \
            --accept-key NGINX_VERSION \
            --accept-key NJS_VERSION \
            --accept-key NJS_RELEASE \
            --accept-key PKG_RELEASE \
            --accept-key DYNPKG_RELEASE \
            --accept-key apkArch \
            myapp:${{ github.sha }}
      - name: Push to registry (only on main)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login -u "${{ secrets.REGISTRY_USER }}" --password-stdin
          docker tag myapp:${{ github.sha }} youruser/myapp:latest
          docker push youruser/myapp:latest
