name: Build & Scan Docker Image with dockle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t myapp:${{ github.sha }} .

      - name: Run Dockle security scan
        run: |
          docker run --rm \ 
            -v /var/run/docker.sock:/var/run/docker.sock \
            goodwithtech/dockle:latest \
            --exit-code 1 \
            --exit-level warn \
            --accept-key NGINX_VERSION \
            --accept-key NJS_VERSION \
            --accept-key NJS_RELEASE \
            --accept-key PKG_RELEASE \
            --accept-key DYNPKG_RELEASE \
            --accept-key apkArch \
            myapp:${{ github.sha }}
      - name: Push to registry (only on main)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login -u "${{ secrets.REGISTRY_USER }}" --password-stdin
          docker tag myapp:${{ github.sha }} youruser/myapp:latest
          docker push youruser/myapp:latest
